<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>도쿄 디즈니랜드 지도</title>
    <meta name="description" content="도쿄 디즈니랜드 파크 내 길찾기 지도" />

    <meta name="theme-color" content="#0B1F4B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Disney Map" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />

    <!-- Leaflet (지도) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- Leaflet.markercluster (마커가 많을 때 자동으로 묶어서 표시) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
      integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/disney.css" />
  </head>
  <body class="disney-page">
    <div id="app">
      <div class="disney-app" id="disneyApp">
        <!-- 상단 고정 검색바 -->
        <div class="disney-topbar">
          <a href="index.html" class="disney-back-btn" aria-label="여행 가이드로 돌아가기">←</a>
          <div class="disney-search-wrap">
            <input
              type="text"
              id="disneySearchInput"
              class="disney-search-input"
              placeholder="어트랙션 · 레스토랑 · 샵 검색"
              autocomplete="off"
            />
          </div>
          <button type="button" class="disney-locate-icon-btn" id="disneyLocateBtn" aria-label="현재 위치">🎯</button>
        </div>
        <div class="disney-search-results" id="disneySearchResults" hidden></div>

        <!-- 파크 전환 (디즈니랜드 / 디즈니씨) -->
        <div class="disney-park-switcher" id="disneyParkSwitcher"></div>

        <!-- 카테고리 필터 칩 -->
        <div class="disney-category-bar" id="disneyCategoryBar"></div>

        <!-- 지도 -->
        <div class="disney-map-wrap">
          <div id="disneyMap" class="disney-map"></div>

          <!-- 상태 배너 (파크 외부 / GPS 정확도 낮음 / 타일 로드 실패) -->
          <div class="disney-banner-stack">
            <div class="disney-banner disney-banner-outside" id="disneyOutsideParkBanner" hidden></div>
            <div class="disney-banner disney-banner-warning" id="disneyLowAccuracyBanner" hidden></div>
            <div class="disney-banner disney-banner-warning" id="disneyTileErrorBanner" hidden></div>
          </div>

          <!-- 우측 상단 보조 액션 (아이 키 프로필 / 공식 지도 PDF / 더보기) -->
          <div class="disney-quick-actions">
            <button type="button" class="disney-quick-btn" id="disneyKidsProfileBtn" aria-label="아이 키 프로필">👶</button>
            <a class="disney-quick-btn" id="disneyMapPdfLink" href="#" target="_blank" rel="noopener" aria-label="공식 지도 PDF 보기">🗺️</a>
            <button type="button" class="disney-quick-btn" id="disneyMoreBtn" aria-label="더보기">⋯</button>
          </div>
          <div class="disney-more-menu" id="disneyMoreMenu" hidden></div>

          <!-- 가장 가까운 화장실 Floating Button -->
          <button type="button" class="disney-restroom-fab" id="disneyRestroomFab">🚻 가장 가까운 화장실</button>

          <!-- 위치 확인 실패 시 대안 패널 -->
          <div class="disney-location-fallback" id="disneyLocationFallback" hidden></div>
        </div>

        <!-- 하단 시트 (목록 / 즐겨찾기 / 추천 동선) -->
        <div class="disney-sheet" id="disneySheet">
          <button type="button" class="disney-sheet-handle" id="disneySheetHandle" aria-label="목록 펼치기/접기"></button>
          <div class="disney-sheet-tabs" id="disneySheetTabs"></div>
          <div class="disney-sheet-content" id="disneySheetContent"></div>
        </div>

        <!-- 시설 상세 바텀시트 -->
        <div class="disney-detail-overlay" id="disneyDetailOverlay">
          <div class="disney-detail-sheet" id="disneyDetailSheet"></div>
        </div>

        <!-- 화장실 찾기 바텀시트 -->
        <div class="disney-detail-overlay" id="disneyRestroomOverlay">
          <div class="disney-detail-sheet" id="disneyRestroomSheet"></div>
        </div>

        <!-- 아이 키 프로필 바텀시트 -->
        <div class="disney-detail-overlay" id="disneyKidsProfileOverlay">
          <div class="disney-detail-sheet" id="disneyKidsProfileSheet"></div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Leaflet -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script
      src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
      integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr"
      crossorigin="anonymous"
    ></script>

    <script src="js/utils.js"></script>
    <script src="js/disneyData.js"></script>
    <script src="js/disney.js"></script>
  </body>
</html>
